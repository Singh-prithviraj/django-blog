<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .post {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .comment {
            background: #f1f1f1;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Django Blog</h1>

    <button onclick="loadPosts()">Load Posts</button>

    <div id="posts"></div>

    <script src="script.js"></script>

</body>
</html>
